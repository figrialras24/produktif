name: Daily Knowledge Synthesizer

on:
  schedule:
    # Eksekusi otomatis tiap hari jam 01:00 UTC (08:00 WIB)
    - cron: '0 1 * * *'
  workflow_dispatch: # Tombol "Run workflow" manual di tab Actions GitHub
  push:
    branches:
      - main

# Hak akses yang dibutuhkan untuk commit catatan dan deploy ke GitHub Pages
permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  synthesize-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run Autonomous Synthesizer
        run: |
          python knowledge_synthesizer/synthesizer.py

      - name: Commit & Push Vault Notes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add knowledge_synthesizer/vault
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore(vault): auto-update daily synthesis [skip ci]" && git push)

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'knowledge_synthesizer'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
